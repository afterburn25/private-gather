name: Private Gather CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-gather-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity and structural gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Composer metadata validation
        run: composer validate --strict

      - name: Private Gather structural verification
        run: |
          php tools/verify-foundation.php
          php tools/verify-installer.php
          php tools/test-installer-runtime.php
          php tools/verify-subdirectory-install.php
          php tools/verify-admin-layout.php
          php tools/verify-upgrader.php
          php tools/verify-v1-structure.php
          php tools/verify-private-gather-brand.php
          php tools/verify-editions.php
          php tools/test-domain-name.php
          php tools/test-upgrade-path.php
          php tools/verify-product-completion.php

      - name: Reject committed secrets and deployment state
        shell: bash
        run: |
          test ! -f .env
          test ! -f storage/app/installed.lock
          bad="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|(^|/)auth\.json$|^database/database\.sqlite$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo 'Secret-bearing environment/auth or live database state is tracked:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

  laravel-runtime:
    name: Hosted Edition runtime and PHPUnit
    runs-on: ubuntu-24.04
    needs: source-integrity
    env:
      PRIVATE_GATHER_EDITION: hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, curl, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            composer audit --locked
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 100 ]; then exit "$code"; fi
            echo "Composer audit network failure (exit 100), retry $attempt/3" >&2
            sleep $((attempt * 3))
          done
          exit 100

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/^PRIVATE_GATHER_EDITION=.*/PRIVATE_GATHER_EDITION=hosted/' .env
          php artisan key:generate --force
          php artisan config:clear
          touch database/database.sqlite

      - name: Laravel boot smoke test
        run: |
          php artisan about
          php artisan route:list --except-vendor

      - name: Database migration smoke test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate:fresh --force

      - name: Hosted PHPUnit
        run: php artisan test

  self-hosted-runtime:
    name: Self-Hosted Edition runtime and policy tests
    runs-on: ubuntu-24.04
    needs: source-integrity
    env:
      PRIVATE_GATHER_EDITION: self_hosted
      SELF_HOSTED_VISIBILITY: private
      SELF_HOSTED_REGISTRATION: approval
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, curl, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Self-Hosted environment
        run: |
          cp .env.example .env
          sed -i 's/^PRIVATE_GATHER_EDITION=.*/PRIVATE_GATHER_EDITION=self_hosted/' .env
          sed -i 's/^SELF_HOSTED_VISIBILITY=.*/SELF_HOSTED_VISIBILITY=private/' .env
          sed -i 's/^SELF_HOSTED_REGISTRATION=.*/SELF_HOSTED_REGISTRATION=approval/' .env
          php artisan key:generate --force
          php artisan config:clear
          touch database/database.sqlite

      - name: Self-Hosted boot smoke test
        run: |
          php artisan about
          php artisan route:list --except-vendor

      - name: Self-Hosted database migration smoke test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate:fresh --force

      - name: Self-Hosted edition PHPUnit
        run: php artisan test --filter='EditionTest|SelfHostedEditionTest|SelfHostedProductCompletionTest'

  php-83-compatibility:
    name: PHP 8.3 minimum compatibility
    runs-on: ubuntu-24.04
    needs: source-integrity
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, curl, dom, fileinfo
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without scripts
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Platform requirement check
        run: composer check-platform-reqs
      - name: Application syntax
        run: find app bootstrap config database routes tests tools install public -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  edition-packages:
    name: Separate Hosted and Self-Hosted release bases
    runs-on: ubuntu-24.04
    needs: [source-integrity, laravel-runtime, self-hosted-runtime]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Setup packaging PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build dedicated Hosted and Self-Hosted bases
        run: |
          mkdir -p dist
          php tools/build-edition-package.php hosted "$GITHUB_SHA" dist
          php tools/build-edition-package.php self_hosted "$GITHUB_SHA" dist

      - name: Verify dedicated installers, protected state and shared Core parity
        shell: bash
        run: |
          hosted="$(find dist -maxdepth 1 -type f -name 'Private-Gather-Hosted-*.zip' -print -quit)"
          self_hosted="$(find dist -maxdepth 1 -type f -name 'Private-Gather-Self-Hosted-*.zip' -print -quit)"
          test -n "$hosted"
          test -n "$self_hosted"
          php tools/verify-edition-packages.php "$hosted" "$self_hosted" "$GITHUB_SHA"
          (cd dist && sha256sum -c ./*.sha256)

      - name: Upload separate edition packages
        uses: actions/upload-artifact@v4
        with:
          name: private-gather-${{ github.sha }}-edition-packages
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
