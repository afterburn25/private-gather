name: Bootstrap Private Gather Source

on:
  push:
    paths:
      - '.bootstrap/READY'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Reassemble and import source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/private-gather-source.tar.xz
          echo '72a23d29b2f1a04c23feadb5f7b295b11ecee24c1cab64b223bf714ef04cc41b  /tmp/private-gather-source.tar.xz' | sha256sum -c -
          rm -rf .bootstrap
          tar -xJf /tmp/private-gather-source.tar.xz -C .
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/private-gather-ci.yml
          mkdir -p public/assets/branding
          curl -fL --retry 3 --retry-delay 2 'https://demo.privoralabs.com/private-gather/assets/branding/private-gather-logo.png' -o public/assets/branding/private-gather-logo.png
          echo '4440eaf43a929325d859bf6fe9dc922f0bd0de7eb0bb240abdd20e24a04ceda2  public/assets/branding/private-gather-logo.png' | sha256sum -c -
          git config user.name 'Private Gather CI'
          git config user.email 'private-gather-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Import Private Gather 1.0.8 hardened source'
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
