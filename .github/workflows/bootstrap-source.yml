name: Bootstrap Private Gather Source

on:
  push:
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reassemble and import source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/private-gather-source.zip
          echo 'fab4991cb53b1e1d7d1e72709a57b3f8a42481915d20bc5ae5d00e1c9ae3cf64  /tmp/private-gather-source.zip' | sha256sum -c -
          rm -rf .bootstrap
          unzip -oq /tmp/private-gather-source.zip -d .
          rm -f .github/workflows/bootstrap-source.yml
          mkdir -p public/assets/branding
          curl -fL --retry 3 --retry-delay 2 'https://demo.privoralabs.com/private-gather/assets/branding/private-gather-logo.png' -o public/assets/branding/private-gather-logo.png
          echo '4440eaf43a929325d859bf6fe9dc922f0bd0de7eb0bb240abdd20e24a04ceda2  public/assets/branding/private-gather-logo.png' | sha256sum -c -
          git config user.name 'Private Gather CI'
          git config user.email 'private-gather-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Import Private Gather 1.0.8 hardened source'
          git push origin HEAD
