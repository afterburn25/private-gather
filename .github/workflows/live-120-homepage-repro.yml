name: Private Gather Live 1.2.0 Homepage Repro

on:
  push:
    branches:
      - repro/live-1.2.0-auth-homepage
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-120-homepage:
    name: Exact 1.2.0 runtime reproduction
    runs-on: ubuntu-24.04
    env:
      PRIVATE_GATHER_EDITION: hosted
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://platform.test
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact repro source
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, curl, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare isolated environment
        run: |
          cp .env.example .env
          sed -i 's/^PRIVATE_GATHER_EDITION=.*/PRIVATE_GATHER_EDITION=hosted/' .env || true
          php artisan key:generate --force
          php artisan config:clear
          rm -f database/database.sqlite
          touch database/database.sqlite

      - name: Laravel boot
        run: php artisan about

      - name: Fresh database
        run: php artisan migrate:fresh --force

      - name: Run exact homepage regression
        run: php artisan test tests/Feature/Live120HomepageRegressionTest.php --stop-on-failure

      - name: Run public member admin route matrix
        run: php artisan test tests/Feature/Live120RouteMatrixTest.php --stop-on-failure

      - name: Run tenant subdomain host regression
        run: php artisan test tests/Feature/Live120TenantSubdomainRegressionTest.php --stop-on-failure
